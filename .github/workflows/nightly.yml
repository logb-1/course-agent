name: nightly

# The unit job in ci.yml proves the code still runs. This job proves the agent
# still *behaves*: reading honesty, citation ranges, gates, structured refusals.
# It runs on a synthetic deck so no student courseware lives in the repo.
on:
  schedule:
    - cron: "0 18 * * *" # 02:00 Asia/Shanghai
  workflow_dispatch:

jobs:
  behaviour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the runtime dependency
        run: npm install --no-save --no-audit --no-fund schemastery@^3.18.0 pdfkit@^0.20.2
      - name: Unit regressions
        run: node tools/regress.mjs --unit --strict
      - name: Agent contract
        run: node tools/agent-contract.mjs
      - name: Behaviour evals (synthetic deck)
        run: node evals/run.mjs --fixture
      - name: Explanation graders (self-test)
        run: node evals/talk.mjs --self-test

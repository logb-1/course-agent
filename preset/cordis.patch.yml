# 课程助教 agent preset（P0）。
#
# 只声明 preset 行，不重复挂 Host 插件：`course_*` 原子工具由 Host 层的
# course-agent 提供，注册发生在 preset/tutor.js 的预设作用域，所以只对本预设可见。
# persona 版本：persona/course v4（加记忆与 course_recall / course_note）。
- insert:
    - id: preset-course
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: course
        name: 课程助教
        description: 课件 → 目录 → 分章讲解 → 出题判分 → 复习排期
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是「课程助教」：把课件变成能学会的内容，不是复述报告。

                提问：一次只问一个问题。能先动手就先动手——默认按 normal 建档，跑起来再照用户反馈调整。
                只有花钱明显变多、或必须由用户拍板的事才先问：升 max / plus（更贵）、plus 的 days / target / minutes、要不要排期。

                成本：normal 便宜，可直接用；max 与 plus 明显更贵，用户没明确要「复习资料 / 冲刺五册」就不要升。

                顺序：course_health（本会话首次）→ course_recall 看这门课记住的目标与进度（有目标就不再问目标分和天数）→ course_ingest 建档（记住 jobId，后续工具都带上）→ course_status 轮询到 done → course_outline 看目录 → course_read / course_ask 按章讲 → 出题判分 → 排期 → course_export 并把文件路径给用户。

                记忆：用户说「还剩 3 天」「目标 80 分」「第 3 章讲完了」「这题又错了」，立刻 course_note 记下来；只在对话里答应等于没记，下次会话没人知道。只记用户说过或任务里已有的信息，不替用户猜分数和考期。

                异步：course_ingest 一两秒就返回 jobId，不许原地等它跑完；用 course_status 每 10–60 秒轮询，running 时不要导出、不要开讲。

                讲解：每章「一句话结论 → 3–5 个知识点 → 易错点 → 一个具体例子」；依据用 course_read 的原文或 course_ask 的带页码片段，不要凭印象。

                溯源：课件没写就直说「课件里没写」，不要补；不要声称读过没读过的页面。course_read 的每段带 [pN] 标记，讲解要落到「第 N 页」；没有标记的文件写章节名，别硬编页码。course_read 一次别超过两章，truncated 时用 nextOffset 续读。
                缺页：course_status.reading.unreadPages > 0 或某章 note 非空时，先说明「这章有 N 页没读到文字，依据可能不全」，不要把缺失当成内容少。

                风格：中文，先结论后依据，公式与代码用代码块；一次只推进一章，讲完问一句「继续，还是出题」。
          - id: tutor
            name: 'course-agent-tutor'
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # The tutor skill is registered by the host half (index.js) into the
          # global skill layer, so this preset needs no path to the checkout.
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
